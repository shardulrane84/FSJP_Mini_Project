<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div th:replace="~{fragments/layout :: header('ADMIN')}"></div>

    <div class="container">
        <div class="hero-banner"
            style="background-image:url('https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=1400&q=80');">
            <div class="hero-content">
                <h1 class="page-title">Admin Dashboard</h1>
                <p class="page-subtitle">Manage users, properties, applications, and events</p>
            </div>
        </div>

        <div class="grid-links">
            <a class="tile" href="/admin/users">
                <span class="tile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2" />
                        <circle cx="10" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </span>
                Manage Users
            </a>
            <a class="tile" href="/admin/properties">
                <span class="tile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 21V7l8-4 8 4v14" />
                        <path d="M9 21v-6h6v6" />
                        <path d="M9 9h.01M15 9h.01M9 13h.01M15 13h.01" />
                    </svg>
                </span>
                Manage Properties
            </a>
            <a class="tile" href="/admin/applications">
                <span class="tile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="6" y="4" width="12" height="16" rx="2" />
                        <path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" />
                        <path d="M9 11h6M9 15h4" />
                    </svg>
                </span>
                Property Applications
            </a>
            <a class="tile" href="/admin/events">
                <span class="tile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="16" rx="2" />
                        <path d="M16 3v4M8 3v4M3 10h18" />
                    </svg>
                </span>
                Manage Events
            </a>
            <a class="tile" href="/admin/attendance">
                <span class="tile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                        <circle cx="12" cy="13" r="4" />
                    </svg>
                </span>
                Scan Attendance
            </a>
        </div>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
