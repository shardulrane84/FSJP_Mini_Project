<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Edit Property</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div th:replace="~{fragments/layout :: header('ADMIN')}"></div>

    <div class="container">
        <div class="page-title-row">
            <span class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M4 21V7l8-4 8 4v14" />
                    <path d="M9 21v-6h6v6" />
                    <path d="M9 9h.01M15 9h.01M9 13h.01M15 13h.01" />
                </svg>
            </span>
            <h1 class="page-title">Edit Property</h1>
        </div>

        <div class="card">
            <form method="post" th:action="@{/admin/properties/update/{id}(id=${editProperty.id})}"
                th:object="${editProperty}">
                <div class="form-grid">
                    <div>
                        <label>Property Name</label>
                        <input type="text" th:field="*{propertyName}" required />
                    </div>
                    <div>
                        <label>Location</label>
                        <input type="text" th:field="*{location}" />
                    </div>
                    <div>
                        <label>Capacity</label>
                        <input type="number" th:field="*{capacity}" />
                    </div>
                    <div>
                        <label>Available</label>
                        <select th:field="*{available}">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                    <div>
                        <label>Description</label>
                        <textarea th:field="*{description}"></textarea>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
                    </div>
                </div>
            </form>
        </div>
        <a href="/admin/properties">Back to Properties</a>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
