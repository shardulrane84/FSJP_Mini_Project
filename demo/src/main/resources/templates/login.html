<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Login | EventManage</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-image"
            style="background-image:url('https://images.unsplash.com/photo-1505373877841-8d25f7d46678?auto=format&fit=crop&w=900&q=80');">
            <div class="auth-quote">
                “Great events aren't planned by chance — they're managed with precision.”
                <span>EventManage</span>
            </div>
        </div>

        <div class="container auth-form card">
            <h2>Welcome back</h2>
            <p class="sub">Login to your EventManage account</p>

            <p class="alert alert-error" th:if="${param.error}">Invalid email or password.</p>
            <p class="alert alert-success" th:if="${param.logout}">Logged out successfully.</p>
            <p class="alert alert-success" th:if="${param.signupSuccess}">Account created. Please login.</p>

            <form method="post" th:action="@{/login}">
                <div class="field">
                    <label>Email</label>
                    <input type="email" name="username" placeholder="you@example.com" required />
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p class="switch">Don't have an account? <a href="/signup">Signup</a></p>
        </div>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
