<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Signup | EventManage</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-image"
            style="background-image:url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=900&q=80');">
            <div class="auth-quote">
                “Join a community that turns seminars into memorable experiences.”
                <span>EventManage</span>
            </div>
        </div>

        <div class="container auth-form card">
            <h2>Create account</h2>
            <p class="sub">Join EventManage as Admin, Speaker, or Student</p>

            <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>

            <form method="post" th:action="@{/signup}">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Shardul Patil" required />
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="you@example.com" required />
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required />
                </div>
                <div class="field">
                    <label>Role</label>
                    <select name="role" required>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create account</button>
            </form>

            <p class="switch">Already have an account? <a href="/login">Login</a></p>
        </div>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
