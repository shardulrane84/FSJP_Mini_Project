<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>My Registrations | Student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div th:replace="~{fragments/layout :: header('STUDENT')}"></div>

    <div class="container">
        <div class="page-title-row">
            <span class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z" />
                    <path d="M9 6v12" stroke-dasharray="3 3" />
                </svg>
            </span>
            <h1 class="page-title">My Registrations</h1>
        </div>
        <p class="page-subtitle">Events you've signed up for — show the QR code at the venue for attendance check-in</p>

        <div class="card" th:each="r : ${registrations}"
            style="display:flex; gap:20px; align-items:center; margin-bottom:16px;">

            <img th:src="@{/student/registrations/{id}/qrcode(id=${r.id})}" alt="QR Ticket" width="120" height="120" />

            <div>
                <h3 th:text="${r.event.title}"></h3>
                <p>Registered: <span th:text="${r.registeredAt}"></span></p>
                <p>
                    Status:
                    <span th:class="'badge badge-' + ${r.status}" th:text="${r.status}"></span>
                </p>
                <p>
                    Attendance:
                    <span th:if="${r.attended}" class="badge badge-APPROVED">Checked In</span>
                    <span th:unless="${r.attended}" class="badge badge-PENDING">Not Checked In</span>
                </p>
            </div>
        </div>

        <p class="empty-state" th:if="${#lists.isEmpty(registrations)}">
            You haven't registered for any event yet.
        </p>
    </div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
