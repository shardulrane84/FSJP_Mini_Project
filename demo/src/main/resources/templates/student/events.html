<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Events | Student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div th:replace="~{fragments/layout :: header('STUDENT')}"></div>

    <div class="container">
        <div class="page-title-row">
            <span class="page-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="16" rx="2" />
                    <path d="M16 3v4M8 3v4M3 10h18" />
                </svg>
            </span>
            <h1 class="page-title">Available Events</h1>
        </div>
        <p class="page-subtitle">Register for seminars and programs</p>

        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${events}">
                        <td th:text="${e.title}"></td>
                        <td th:text="${e.eventDate}"></td>
                        <td th:text="${e.startTime} + ' - ' + ${e.endTime}"></td>
                        <td><span th:class="'badge badge-' + ${e.status}" th:text="${e.status}"></span></td>
                        <td class="actions-cell">
                            <form method="post" th:action="@{/student/events/register/{id}(id=${e.id})}"
                                th:if="${e.status.name() == 'SCHEDULED'}">
                                <button type="submit" class="btn btn-primary btn-sm">Register</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <p class="empty-state" th:if="${#lists.isEmpty(events)}">No events available right now.</p>
        </div>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
